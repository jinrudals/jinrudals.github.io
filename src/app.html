<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      (() => {
        const stored = localStorage.getItem('lang');
        const p = location.pathname;
        const isEn = /^\/en(\/|$)/.test(p);
        const want = stored === 'ko' || stored === 'en' ? stored : navigator.language.toLowerCase().startsWith('en') ? 'en' : 'ko';
        if (want === 'en' && !isEn) location.replace('/en' + (p === '/' ? '' : p) + location.search + location.hash);
        else if (want === 'ko' && isEn) location.replace((p.replace(/^\/en/, '') || '/') + location.search + location.hash);
      })();
      const t = localStorage.getItem('theme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
